name: Frontend Tests

on:
  push:
    branches: [development, feature/sonarr-integrations]
    paths:
      - 'frontend/**'
      - 'tests/frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests/frontend/**'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - run: npm --prefix tests/frontend ci --ignore-scripts
      - run: npm --prefix tests/frontend test
